<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>L'Océan — Connexion</title>

  <script
    type="text/javascript"
    src="https://identity.netlify.com/v1/netlify-identity-widget.js">
  </script>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f4f2ed;
      font-family:Arial,sans-serif;
      color:#1f2d3a;
    }

    .card{
      width:400px;
      max-width:calc(100% - 40px);
      background:white;
      padding:30px;
      border-radius:18px;
      border:1px solid #ddd;
    }

    h1{
      margin-top:0;
    }

    [data-netlify-identity-button]{
      margin-top:25px;
      padding:16px;
      background:#1f2d3a;
      color:white;
      text-align:center;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Connexion</h1>

    <p>
      Accès réservé à l'équipe de L'Océan.
    </p>

    <div data-netlify-identity-button>
      Se connecter
    </div>

  </div>

</body>
</html>
