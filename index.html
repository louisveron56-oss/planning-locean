<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>L'Océan — Connexion</title>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    :root{
      --navy:#1f2d3a;
      --bg:#f4f2ed;
      --card:#ffffff;
      --muted:#6f777d;
      --border:#deddd8;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--navy);
    }

    .card{
      width:min(430px,100%);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:28px;
      box-shadow:0 18px 60px rgba(20,30,45,.10);
    }

    .brand{
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.12em;
      font-weight:800;
      color:var(--muted);
    }

    h1{
      margin:8px 0 0;
      font-size:28px;
      line-height:1.05;
    }

    p{
      margin:12px 0 0;
      font-size:14px;
      line-height:1.55;
      color:var(--muted);
    }

    button{
      width:100%;
      min-height:48px;
      margin-top:20px;
      border:0;
      border-radius:12px;
      background:var(--navy);
      color:#fff;
      font:inherit;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
    }

    .status{
      margin-top:14px;
      font-size:12px;
      color:var(--muted);
      text-align:center;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">L'Océan · Outil interne</div>

    <h1>Connexion</h1>

    <p id="copy">
      Finalise ton invitation ou connecte-toi pour accéder à l'application.
    </p>

    <button type="button" id="loginBtn">
      Se connecter
    </button>

    <div class="status" id="status">
      Chargement de l'authentification…
    </div>
  </main>

  <script>
    (function(){

      const status = document.getElementById('status');
      const loginBtn = document.getElementById('loginBtn');

      function goToApp(){
        window.location.replace('/planning_locean.html');
      }

      function hashType(){

        const h = window.location.hash || '';

        if(h.includes('invite_token=')){
          return 'invite';
        }

        if(h.includes('recovery_token=')){
          return 'recovery';
        }

        if(h.includes('confirmation_token=')){
          return 'signup';
        }

        return null;
      }

      function openForHash(){

        const type = hashType();

        if(type === 'invite'){

          status.textContent =
            "Invitation détectée — ouverture de la création de compte…";

          setTimeout(function(){
            netlifyIdentity.open('signup');
          },150);

          return;
        }

        if(type === 'recovery'){

          status.textContent =
            "Lien de récupération détecté…";

          setTimeout(function(){
            netlifyIdentity.open('login');
          },150);

          return;
        }

        if(type === 'signup'){

          status.textContent =
            "Confirmation détectée…";

          setTimeout(function(){
            netlifyIdentity.open('signup');
          },150);

          return;
        }

        status.textContent = "Prêt.";
      }

      loginBtn.addEventListener('click',function(){

        if(window.netlifyIdentity){
          netlifyIdentity.open('login');
        }

      });

      if(!window.netlifyIdentity){

        status.textContent =
          "Erreur : Netlify Identity n'est pas chargé.";

        return;
      }

      netlifyIdentity.on('init',function(user){

        if(user){

          status.textContent =
            "Connexion reconnue. Ouverture de l'application…";

          goToApp();

          return;
        }

        openForHash();

      });

      netlifyIdentity.on('login',function(){

        try{
          netlifyIdentity.close();
        }catch(e){}

        status.textContent =
          "Connexion réussie. Ouverture de l'application…";

        goToApp();

      });

      netlifyIdentity.on('signup',function(){

        status.textContent =
          "Compte créé. Tu peux maintenant te connecter.";

      });

      netlifyIdentity.on('error',function(err){

        console.error(err);

        status.textContent =
          "Une erreur d'authentification s'est produite.";

      });

      netlifyIdentity.init();

    })();
  </script>
</body>
</html>
